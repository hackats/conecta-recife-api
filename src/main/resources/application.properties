spring.application.name=conecta-recife-api
app.data.directory=./data
app.data.expected-cidadaos=89046
app.data.expected-servicos=843
app.data.expected-cliques=593056
server.port=8080

# Pesos escolhidos pela validação temporal da etapa 3
app.recomendacao.a=1
app.recomendacao.b=0.5
app.recomendacao.c=4

# Defina a origem exata do front Kodiak quando estiver disponível
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

# Swagger / OpenAPI
springdoc.packages-to-scan=br.com.conectarecife.controller
springdoc.use-fqn=true
springdoc.override-with-generic-response=false
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.validator-url=
